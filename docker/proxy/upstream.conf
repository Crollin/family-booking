# Deux correspondances utilisées par default.conf, qui doivent vivre au niveau
# `http` et non dans un bloc `server`.

# Relaie l'en-tête Connection nécessaire aux WebSockets sans le forcer sur les
# requêtes HTTP ordinaires.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Conserve le protocole d'origine lorsqu'un reverse proxy TLS est placé devant,
# et retombe sur celui de la connexion courante sinon.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
